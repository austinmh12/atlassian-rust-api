[package]
name = "atlassian-rust-api"
version = "0.1.0"
edition = "2024"
authors = ["Austin Heil"]
description = "A wrapper for the Atlassian REST API written in Rust"
readme = "readme.md"
repository = "https://github.com/austinmh12/atlassian-rust-api.git"
license = "Apache License 2.0"
keywords = ["rest", "api", "atlassian", "jira", "confluence", "bitbucket"]

[dependencies]
# Web
reqwest = { version = "0.13", features = ["json"] }
url = "2.5"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
derive_more = { version = "2.1", features = ["from", "display"] }